<!DOCTYPE html>
<!-- page where my results and feedback will be shown-->
<html>
<body>

    <main style="padding: 40px; text-align: center; max-width: 600px; margin: 0 auto;">
        <h2>Assessment Complete</h2>
        <!-- all the curly brackets here will be filled in with the variables from app.py-->
        <p><b>Regional EAWS Danger Level:</b> {{ eaws }}/5</p>
        <p><b>Calculated Risk Score:</b> {{ score }}</p>
        <h1 style="color: {{ color }}; font-size: 42px;">Recommendation: {{ verdict }}</h1>
        <p style="color: #555;"><i>{{ reason }}</i></p>

        <br><br>
        <a href="/evaluate" class="btn-primary">Run Another Assessment</a>
    </main>

</body>
</html>
