<!DOCTYPE html>
<html>
<head>
    <title>SlopeGuard Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo-area">
            <span class="logo-text">SlopeGuard Assessment Inputs</span>
        </div>
        <div class="nav-buttons">
            <!-- reroutes to the home page here-->
            <a href="/" class="btn-secondary">Back Home</a>
        </div>
    </header>

    <main style="padding: 40px; max-width: 500px; margin: 0 auto;">
        <h2>Enter Details</h2>
        <form action="/calculate" method="POST">
            <p>
            <label for="eaws_mode">Avalanche Rating Mode:</label><br>
                <select id="eaws_mode" name="eaws_mode" style="padding: 8px; width: 320px;">
                    <option value="auto" selected>Auto-fetch live reading</option>
                    <option value="manual">Enter EAWS rating manually</option>
                </select>
            </p>
        <p>
                <label for="location">Region / Area Location:</label><br>
                <select id="location" name="location" required style="padding: 8px; width: 320px;">
                    <option value="Lower Valais"> Haut Valais / Oberallis</option>
                    <option value="Upper Valais">Bas Valais / Untervallis</option>
                    <option value="Graubunden">Graubünden / Grisons (Engadin, Davos, St. Moritz)</option>
                    <option value="Northern Alps">Northern Alps (Bernese Oberland/Central CH)</option>
                    <option value="Eastern Alps">Eastern Alps (Glarus, St. Gallen, Alpstein)</option>
                    <option value="Gotthard">Central Alps / Gotthard Region (Andermatt, Uri)</option>
                    <option value="Ticino">Ticino / Tessin (Southern Alps)</option>
                    <option value="Jura">Jura Mountains</option>
                </select>
        </p>


            <p>
                <label for="manual_eaws">Manual EAWS Level:</label><br>
                <select id="manual_eaws" name="manual_eaws" style="padding: 8px; width: 320px;">
                    <option value="">-- Select EAWS Level --</option>
                    <option value="1">Level 1 - Low (Green)</option>
                    <option value="2">Level 2 - Moderate (Yellow)</option>
                    <option value="3">Level 3 - Considerable (Orange)</option>
                    <option value="4">Level 4 - High (Red)</option>
                    <option value="5">Level 5 - Very High (Black)</option>
                </select>
            </p>
                <label>Slope Angle (Degrees):</label><br>
                <input type="number" name="slope_angle" min="0" max="90" required>
                <!-- the required essentially checks if the field is left empty and shows an error message-->
            <p>
                <label>Slope Aspect (Direction):</label><br>
                <select name="slope_aspect">
                    <option value="N">North</option>
                    <option value="NE">Northeast</option>
                    <option value="E">East</option>
                    <option value="SE">Southeast</option>
                    <option value="S">South</option>
                    <option value="SW">Southwest</option>
                    <option value="W">West</option>
                    <option value="NW">Northwest</option>
                </select>
            </p>

            <p>
                <!-- including this in for now but might take out am unsure yet-->
                <label>Terrain Familiarity:</label><br>
                <select name="familiarity">
                    <option value="regular">I ski here regularly</option>
                    <option value="sometimes">I have skied here a few times</option>
                    <option value="first_time">First time skiing this area</option>
                </select>
            </p>

            <p>
                <!-- drop down for the group size-->
                <label>Group Size:</label><br>
                <select name="group_size">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3-4">3-4</option>
                    <option value="5+">5+</option>
                </select>
            </p>
            <!-- using a checklist format-->
            <p>
                <label><b>Safety Gear Checklist:</b></label><br>
                <input type="checkbox" name="gear_transceiver" value="yes"> Transceiver<br>
                <input type="checkbox" name="gear_probe" value="yes"> Probe<br>
                <input type="checkbox" name="gear_shovel" value="yes"> Shovel<br>
                <input type="checkbox" name="gear_airbag" value="yes"> Airbag
            </p>
            <button type="submit" class="btn-primary" style="border:none; cursor:pointer;">Run Risk Analysis</button>
        </form>
    </main>

</body>
</html>
